<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3" />

  <!-- Compass / Radar concentric circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25" />

  <!-- River / Waves Symbol -->
  <path d="M 120 310 C 170 280, 210 340, 260 310 C 310 280, 350 340, 392 310" 
        fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" />
  <path d="M 140 350 C 180 325, 220 375, 260 350 C 300 325, 340 375, 372 350" 
        fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" opacity="0.7" />

  <!-- Stylized Fish / Dorado Jump -->
  <g filter="url(#glow)">
    <path d="M 160 250 C 190 170, 310 160, 360 210 C 330 200, 280 205, 240 230 C 200 255, 170 260, 160 250 Z" 
          fill="url(#emeraldGrad)" />
    <!-- Tail Fin -->
    <path d="M 160 250 L 120 220 C 135 245, 135 255, 120 280 Z" 
          fill="url(#emeraldGrad)" />
    <!-- Dorsal Fin -->
    <path d="M 270 180 C 290 150, 320 160, 330 195 Z" 
          fill="#34d399" />
    <!-- Eye -->
    <circle cx="335" cy="205" r="7" fill="#020617" />
    <circle cx="337" cy="203" r="3" fill="#ffffff" />
  </g>

  <!-- Hook Accent -->
  <path d="M 330 260 C 350 260, 365 245, 365 225 L 365 210" 
        fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />

  <!-- Remanso Badge Text -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    REMANSO
  </text>
  <text x="256" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="2">
    PARANÁ &amp; CARCARAÑÁ
  </text>
</svg>
